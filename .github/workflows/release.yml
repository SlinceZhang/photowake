name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      image_registry: ${{ steps.compute.outputs.image_registry }}
      image_name: ${{ steps.compute.outputs.image_name }}
      image_tag: ${{ steps.compute.outputs.image_tag }}
      vercel_prod: ${{ steps.compute.outputs.vercel_prod }}
      deploy_env: ${{ steps.compute.outputs.deploy_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute metadata
        id: compute
        run: |
          REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REGISTRY="${REGISTRY}"
          IMAGE_NAME="${REPO_LC}-server"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DEPLOY_ENV="production"
            IMAGE_TAG="prod-${SHORT_SHA}"
            VERCEL_PROD="true"
          else
            DEPLOY_ENV="preview"
            IMAGE_TAG="dev-${SHORT_SHA}"
            VERCEL_PROD="false"
          fi
          echo "image_registry=${IMAGE_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "vercel_prod=${VERCEL_PROD}" >> "$GITHUB_OUTPUT"
          echo "deploy_env=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"

  build_server_image:
    name: Build & publish server image
    needs: metadata
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image_ref.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.metadata.outputs.image_registry }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ needs.metadata.outputs.image_registry }}/${{ needs.metadata.outputs.image_name }}"
          PRIMARY_TAG="${IMAGE}:${{ needs.metadata.outputs.image_tag }}"
          TAGS="${PRIMARY_TAG}"
          if [ "${{ needs.metadata.outputs.deploy_env }}" = "production" ]; then
            TAGS="$TAGS\n${IMAGE}:latest"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Export image reference
        id: image_ref
        run: |
          echo "image_ref=${{ needs.metadata.outputs.image_registry }}/${{ needs.metadata.outputs.image_name }}:${{ needs.metadata.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

  deploy_web:
    name: Deploy web to Vercel
    needs:
      - metadata
      - build_server_image
    runs-on: ubuntu-latest
    environment: ${{ needs.metadata.outputs.deploy_env }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Deploy to Vercel
        uses: vercel/action@v3
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          working-directory: web
          vercel-args: ${{ needs.metadata.outputs.vercel_prod == 'true' && '--prebuilt --prod' || '--prebuilt' }}

      - name: Publish deployment summary
        run: |
          echo "### Deployment summary" >> "$GITHUB_STEP_SUMMARY"
          echo "* Environment: ${{ needs.metadata.outputs.deploy_env }}" >> "$GITHUB_STEP_SUMMARY"
          echo "* Web deploy: ${{ github.repository }}@${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "* Server image: ${{ needs.build_server_image.outputs.image_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "* Image digest: ${{ needs.build_server_image.outputs.image_digest }}" >> "$GITHUB_STEP_SUMMARY"
